<div class="content" [ngClass]="theme()">

  <mat-toolbar fixedInViewport [ngClass]="(isHandset$ | async) ? 'mobile-header' : 'not-mobile-header'">
    <img src="/logo.svg" alt="Logo" class="logo"  />
    <span class="menu-spacer"></span>
    
    <p>INICIO</p>
    <p>PORTFOLIO</p>
    <p>NOSOTROS</p>
    <p>SERVICIOS</p>
    <p>CLIENTES</p>
    <p>CONTACTO</p>


    <button matButton="filled" class="talk-button">HABLEMOS</button>

    <span class="spacer"></span>

    <lib-toolbar-icons [instaUrl]="'https://www.instagram.com/chan/?hl=es'"></lib-toolbar-icons>
  </mat-toolbar>

  <div class="inner-content">
    <router-outlet></router-outlet>
  </div>

</div>
